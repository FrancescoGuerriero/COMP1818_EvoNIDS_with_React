name: Publish EvoNIDS experiment dashboard
on:
  push:
    branches: [main]
    paths:
      - 'online-experiments/**'
      - '.github/workflows/publish-online-experiments.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: evonids-public-research-dashboard
          path: online-experiments/index.html
          retention-days: 90
      - uses: actions/upload-pages-artifact@v3
        with:
          path: online-experiments
  check-pages:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        shell: bash
        run: |
          if curl -fsS https://api.github.com/repos/$GITHUB_REPOSITORY/pages >/dev/null; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'GitHub Pages is not enabled; the HTML artifact and GitHub README graphs remain public.'
          fi
  deploy:
    needs: [publish, check-pages]
    if: needs.check-pages.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
